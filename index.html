<title>Barbersio — prototypy</title>

<style>
  :root{
    --bg:#14110f; --surface:#1c1917; --surface-2:#23201d;
    --text:#f5f5f4; --muted:#b8b1aa; --faint:#8a827c;
    --hair:rgba(255,255,255,0.08); --hair-strong:rgba(255,255,255,0.16);
    --accent:#f5f5f4; --accent-ink:#1c1917;
    --ok:#6ee7a8; --ok-bg:rgba(110,231,168,0.12); --ok-border:rgba(110,231,168,0.30);
    --font:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:920px;margin:0 auto;padding:64px 24px 96px}

  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo-mark{height:30px;width:auto;display:block}
  .logo-mark path,.logo-mark rect{fill:var(--text)}

  h1{font-weight:700;font-size:38px;line-height:1.05;letter-spacing:-0.02em;
    margin:28px 0 10px}
  .lede{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 40px;max-width:560px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){ .grid{grid-template-columns:1fr} .wrap{padding:44px 18px 72px} h1{font-size:30px} }

  .card{display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:16px;
    background:var(--surface);border:1px solid var(--hair);
    transition:border-color 160ms ease,transform 160ms ease,background 160ms ease}
  .card:hover{border-color:var(--hair-strong);transform:translateY(-2px);background:var(--surface-2)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .card .name{font-weight:700;font-size:18px;letter-spacing:-0.01em}
  .card .desc{color:var(--muted);font-size:14px;line-height:1.5}
  .tag{flex:0 0 auto;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
    background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
  .tag.wip{background:rgba(184,177,170,0.12);border-color:var(--hair-strong);color:var(--muted)}
  .go{margin-top:auto;display:inline-flex;align-items:center;gap:7px;
    font-weight:600;font-size:14px;color:var(--text)}
  .go .arrow{transition:transform 160ms ease}
  .card:hover .go .arrow{transform:translateX(4px)}

  .empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--faint);
    border:1px dashed var(--hair-strong);border-radius:16px;font-size:15px}

  footer{margin-top:44px;color:var(--faint);font-size:13px;line-height:1.6}
  footer code{background:var(--surface);border:1px solid var(--hair);
    padding:2px 7px;border-radius:6px;font-size:12px;color:var(--muted)}
</style>
</head>

  </script>

  <script>
    const grid = document.getElementById("grid");
    const valid = PROTOTYPY.filter(p => p.url && !p.url.includes("VLOZ-SEM-ID"));

    if (valid.length === 0 && PROTOTYPY.length > 0) {
      // ukáž všechny i s placeholder URL, ať kolega ví, že se chystají
    }

    (PROTOTYPY.length ? PROTOTYPY : []).forEach(p => {
      const ready = p.url && !p.url.includes("VLOZ-SEM-ID");
      const el = document.createElement(ready ? "a" : "div");
      el.className = "card";
      if (ready) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }
      el.innerHTML = `
        <div class="top">
          <span class="name">${p.name}</span>
          <span class="tag ${p.status === 'wip' ? 'wip' : ''}">${p.status === 'wip' ? 'Rozpracováno' : 'Živé'}</span>
        </div>
        <span class="desc">${p.desc}</span>
        <span class="go">${ready ? 'Otevřít' : 'Zatím bez odkazu'} <span class="arrow">${ready ? '→' : ''}</span></span>
      `;
      grid.appendChild(el);
    });

    if (PROTOTYPY.length === 0) {
      grid.innerHTML = '<div class="empty">Zatím tu nejsou žádné prototypy.</div>';
    }

    document.getElementById("date").textContent =
      new Date().toLocaleDateString("cs-CZ", { day:"numeric", month:"long", year:"numeric" });
  </script>
</body>
</html>
